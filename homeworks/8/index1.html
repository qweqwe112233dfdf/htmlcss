<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        table {
            border-collapse: collapse;
            min-width: 1000px;
            margin: 0 auto;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 15px 25px;
            text-align: center;
            white-space: nowrap;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #333;
            color: white;
            z-index: 2;
        }

        tr > :first-child {
            position: sticky;
            left: 0;
            background: white;
            z-index: 1;
        }

        thead tr > :first-child {
            z-index: 3;
            background: #333;
            color: white;
        }

        tbody tr:nth-child(even) {
            background: #f2f2f2;
        }

        tbody tr:nth-child(even) > :first-child {
            background: #f2f2f2;
        }

        tbody tr:nth-child(odd) > :first-child {
            background: white;
        }

        tr > :last-child {
            font-weight: bold;
        }

        tr > :nth-child(even) {
            background-color: #fafafa;
        }

        thead tr > :nth-child(even) {
            background-color: #333;
        }

        tbody tr:nth-child(even) > :first-child {
            background-color: #f2f2f2;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>Таблиця студентів</h1>

    <div class="table-wrapper">

                    <th>Header 6</th>

            </thead>

                    <td>92</td>
                    <td>94</td>
                </tr>

</body>
</html>
