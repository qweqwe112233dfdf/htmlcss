<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;

            width: 600px;
            height: 300px;

            display: flex;

            overflow: hidden;

            border: 3px solid black;
        }

        .text {
            position: absolute;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;

            font-size: 24px;
            text-align: center;

        }

        .door {
            position: relative;

            width: 50%;
            height: 100%;

            background: grey;

            z-index: 2;

            transition: transform 2s ease;
        }

        .left {
            border-right: 2px solid black;
        }

        .right {
            border-left: 2px solid black;
        }

        .container:hover .left {
            transform: translateX(-100%);
        }

        .container:hover .right {
            transform: translateX(100%);
        }

        .door::before {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
;
            font-size: 20px;
            font-weight: bold;

            white-space: nowrap;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="text">
        Привіт!
    </div>

    <div class="door left"></div>
    <div class="door right"></div>

</div>

</body>
</html>
