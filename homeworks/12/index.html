<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <form>
    <h2>Credit Card Details</h2>

    <label for="cardNumber">Card Number</label>
    <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456">

    <label for="cardName">Name On Card</label>
    <input type="text" id="cardName" name="cardName" placeholder="Name Surname">

    <label>Expire Date</label>
    <input type="text" name="expireMonth" placeholder="MM">
    <input type="text" name="expireYear" placeholder="YYYY">

    <label for="csv">CSV No.</label>
    <input type="text" id="csv" name="csv" placeholder="***">

    <button type="submit">Submit</button>
  </form>

</body>
</html>
